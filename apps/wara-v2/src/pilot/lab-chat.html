<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WARA V2 — Chat laboratorio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, sans-serif;
      --wara: #4a0e1c;
    }
    body { max-width: 960px; margin: 0 auto; padding: 1rem; background: #f8fafc; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; color: var(--wara); }
    .muted { opacity: 0.75; font-size: 0.9rem; }
    .banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      margin: 0.75rem 0;
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0; align-items: center; }
    input[type="password"], input[type="text"] { flex: 1; min-width: 200px; padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1; }
    button { padding: 0.5rem 0.75rem; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; }
    button.primary { background: var(--wara); color: #fff; border-color: var(--wara); }
    button.primary:hover { background: #6b1428; }
    #log {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 300px;
      max-height: 52vh;
      overflow: auto;
      white-space: pre-wrap;
      background: #fff;
    }
    .user { color: #1d4ed8; margin: 0.5rem 0; }
    .bot { color: #15803d; margin: 0.5rem 0; }
    .sys { color: #64748b; margin: 0.35rem 0; font-size: 0.85rem; }
    .err { color: #b91c1c; margin: 0.5rem 0; }
    #state { font-family: ui-monospace, monospace; font-size: 0.75rem; background: #f1f5f9; padding: 0.75rem; border-radius: 8px; overflow: auto; max-height: 200px; }
    .badge { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 4px; background: #4a0e1c22; font-size: 0.75rem; color: var(--wara); }
    .phone-emulate { font-family: ui-monospace, monospace; font-weight: 600; color: var(--wara); }
    .shortcuts button { font-size: 0.8rem; }
    a.lab-link { color: var(--wara); font-weight: 600; }
  </style>
</head>
<body>
  <h1>WARA V2 — Chat de laboratorio</h1>
  <p class="muted">Emula WhatsApp sin enviar mensajes reales · DELIVERY_ENABLED=false</p>

  <div class="banner">
    Este chat simula los mensajes de WhatsApp del número
    <span class="phone-emulate" id="phoneDisplay">__LAB_PHONE__</span>.
    Los tickets derivados aparecen en
    <a class="lab-link" id="frontLabLink" href="__LAB_FRONT_URL__/tickets" target="_blank" rel="noopener">front-v2-lab</a>.
  </div>

  <div class="row" id="keyRow">
    <label>API key <input type="password" id="apiKey" placeholder="WARA_V2_TURN_API_KEY" autocomplete="off" /></label>
    <button type="button" id="saveKey">Guardar clave</button>
    <span class="badge" id="status">sin clave</span>
  </div>

  <div class="row shortcuts">
    <label class="badge">Conductor
      <select id="conductorMode" title="V2 actual vs Commander V3">
        <option value="v2">V2 actual</option>
        <option value="v3">Commander V3</option>
      </select>
    </label>
    <button type="button" data-msg="listas de unidades">1. Listas unidades</button>
    <button type="button" data-msg="2">2. Empresa 2</button>
    <button type="button" data-msg="1">3. Unidad 1</button>
    <button type="button" data-msg="necesito hablar con un asesor">4. Pedir asesor</button>
    <button type="button" data-msg="CONFIRMO">5. CONFIRMO</button>
    <button type="button" id="newChat" title="Limpia trámites, drafts, confirmaciones e historial. Conserva empresa/unidad.">Nueva conversación</button>
    <button type="button" id="hardReset" title="Limpia también empresa y unidad">Reiniciar todo</button>
    <button type="button" id="refreshState">Estado</button>
    <button type="button" id="showTrace" title="Último TurnPlan / tools V3">Trace V3</button>
  </div>

  <div id="log" aria-live="polite"></div>

  <div class="row">
    <input type="text" id="input" placeholder="Escribí un mensaje como si fuera WhatsApp…" autocomplete="off" />
    <button type="button" id="send" class="primary">Enviar</button>
  </div>

  <h2 style="font-size:1rem;color:#475569">Estado conversacional</h2>
  <pre id="state">—</pre>

  <script>
    const PHONE = "__LAB_PHONE__";
    const TENANT = "__LAB_TENANT__";
    const FRONT_LAB = "__LAB_FRONT_URL__";
    const AUTO_AUTH = __LAB_AUTO_AUTH__;
    const PRESET_KEY = "__LAB_API_KEY__";
    const KEY_STORAGE = "wara_v2_lab_api_key";

    const el = (id) => document.getElementById(id);
    const log = el("log");
    const statePre = el("state");
    const input = el("input");
    const apiKeyInput = el("apiKey");

    function uuid() {
      return crypto.randomUUID();
    }

    function getKey() {
      return sessionStorage.getItem(KEY_STORAGE) || PRESET_KEY || "";
    }

    function setStatus(text, ok) {
      const s = el("status");
      s.textContent = text;
      s.style.background = ok ? "#16a34a33" : "#dc262633";
    }

    function append(role, text) {
      const div = document.createElement("div");
      div.className = role;
      const prefix =
        role === "user" ? "Vos (" + PHONE + "): " :
        role === "bot" ? (el("conductorMode").value === "v3" ? "Atilio V3: " : "Atilio V2: ") :
        role === "sys" ? "· " : "";
      div.textContent = prefix + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function api(path, opts = {}) {
      const key = getKey();
      if (!key) throw new Error("Configurá la API key primero");
      const res = await fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          "X-Api-Key": key,
          ...(opts.headers || {}),
        },
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || body.message || res.statusText);
      return body;
    }

    async function refreshState() {
      try {
        const q = new URLSearchParams({ phone: PHONE, tenantId: TENANT });
        if (el("conductorMode").value === "v3") {
          const data = await api("/api/lab/v3/state?" + q.toString());
          statePre.textContent = JSON.stringify(data.state, null, 2);
        } else {
          const data = await api("/api/pilot/state?" + q.toString());
          statePre.textContent = JSON.stringify(data.state, null, 2);
        }
      } catch (e) {
        statePre.textContent = "Error: " + e.message;
      }
    }

    async function resetChat(mode) {
      if (el("conductorMode").value === "v3") {
        await api("/api/lab/v3/reset", {
          method: "POST",
          body: JSON.stringify({ phone: PHONE, tenantId: TENANT, mode }),
        });
        log.innerHTML = "";
        append("sys", "Reinicio estado Commander V3 (" + mode + ") para " + PHONE);
        await refreshState();
        return;
      }
      const data = await api("/api/pilot/reset", {
        method: "POST",
        body: JSON.stringify({ phone: PHONE, tenantId: TENANT, mode }),
      });
      log.innerHTML = "";
      append(
        "sys",
        mode === "hard"
          ? "Reinicio total para " + PHONE + " (sin empresa/unidad)."
          : "Nueva conversación para " + PHONE + " (trámites e historial limpios).",
      );
      if (data.verify) {
        append(
          "sys",
          "Verify: pending=" +
            data.verify.pendingConfirmation +
            " cert=" +
            data.verify.certificateDraft +
            " turns=" +
            data.verify.recentTurns,
        );
      }
      await refreshState();
    }

    async function syncConductorMode() {
      const mode = el("conductorMode").value === "v3" ? "v3" : "v2";
      sessionStorage.setItem("wara_lab_conductor", mode);
      await api("/api/lab/conductor", {
        method: "POST",
        body: JSON.stringify({ phone: PHONE, mode }),
      });
      append("sys", "Conductor activo: " + (mode === "v3" ? "Commander V3" : "V2 actual"));
      await refreshState();
    }

    async function sendMessage(textOverride) {
      const text = (textOverride ?? input.value).trim();
      if (!text) return;
      if (!textOverride) input.value = "";
      const messageId = uuid();
      append("user", text);
      try {
        const data = await api("/api/whatsapp/turn", {
          method: "POST",
          body: JSON.stringify({ phone: PHONE, message: text, messageId }),
        });
        if (data.message) append("bot", data.message);
        else if (data.skipResponse_s === "true") append("sys", "(V2 en silencio — takeover humano activo)");
        else if (data.error) append("err", data.error);
        else append("sys", "(sin respuesta)");
        setStatus("conectado", true);
        await refreshState();
      } catch (e) {
        append("err", e.message);
        setStatus("error", false);
      }
    }

    el("saveKey").onclick = () => {
      const v = apiKeyInput.value.trim();
      if (!v) return;
      sessionStorage.setItem(KEY_STORAGE, v);
      setStatus("clave guardada", true);
    };

    el("send").onclick = () => sendMessage();
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    el("newChat").onclick = () => resetChat("soft").catch((e) => append("err", e.message));
    el("hardReset").onclick = () => resetChat("hard").catch((e) => append("err", e.message));
    el("refreshState").onclick = () => refreshState();
    el("showTrace").onclick = async () => {
      try {
        const q = new URLSearchParams({ phone: PHONE, tenantId: TENANT });
        const data = await api("/api/lab/v3/trace?" + q.toString());
        statePre.textContent = JSON.stringify(data.trace, null, 2);
      } catch (e) {
        append("err", e.message);
      }
    };
    el("conductorMode").onchange = () => syncConductorMode().catch((e) => append("err", e.message));
    const savedMode = sessionStorage.getItem("wara_lab_conductor");
    if (savedMode === "v3" || savedMode === "v2") {
      el("conductorMode").value = savedMode;
    }

    document.querySelectorAll("[data-msg]").forEach((btn) => {
      btn.addEventListener("click", () => sendMessage(btn.getAttribute("data-msg")));
    });

    if (AUTO_AUTH && PRESET_KEY) {
      apiKeyInput.value = "••••••••";
      el("keyRow").style.display = "none";
      setStatus("listo — emula " + PHONE, true);
      append("sys", "Chat configurado. Emulando WhatsApp de " + PHONE + ". Usá los atajos o escribí abajo.");
    } else {
      const saved = getKey();
      if (saved) {
        apiKeyInput.value = saved;
        setStatus("clave en sesión", true);
      }
    }

    el("phoneDisplay").textContent = PHONE;
    el("frontLabLink").href = FRONT_LAB + "/tickets";
    refreshState();
  </script>
</body>
</html>
