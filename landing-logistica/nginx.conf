server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        text/plain
        application/javascript
        application/json
        image/svg+xml;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|webp|gif|svg|css|js|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Serve from root path
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Support sub-path deployment (e.g., /borrador-web/)
    # This location block catches all sub-paths and serves the same content
    location ~ ^/[^/]+/ {
        # Try to serve the file directly, or fall back to index.html
        # Remove the first path segment for file lookup
        rewrite ^/[^/]+/(.*) /$1 break;
        try_files $uri $uri/ /index.html;
    }
    
    # Disable access logs for favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
